models:                          # G0 pair; chat=true means the model's chat template is used
  - {id: allenai/OLMo-2-1124-7B-Instruct, chat: true}
  - {id: allenai/OLMo-2-1124-7B, chat: false}
smoke_model: {id: Qwen/Qwen2.5-0.5B-Instruct, chat: true}

analysis:
  w_alpha: 0.5                   # add-alpha smoothing for the world prior W (leave-one-out)

gate:
  primary_model_tag: OLMo-2-1124-7B-Instruct
  go_mode_match: 0.50            # share of wrong greedy answers equal to the ghost-prior mode
  max_chance: 0.10               # uniform-chance mode-match must be below this
  go_delta_auroc: 0.03           # held-out AUROC gain from adding s_m to [log c, log n]
  kill_mode_match: 0.30
  pivot_delta_auroc: 0.01
  min_reliability: 0.90          # split-half reliability of the ghost prior F
  min_freegen_agreement: 0.85    # free greedy answer maps to the scored argmax
  min_wrong: 60
